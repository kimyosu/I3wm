include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/modules.ini
[bar/example]
monitor = ${env:primary}
width = 100%
height = 24pt
radius = 0


; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 2
border-color = ${colors.primary}

padding-left = 0
padding-right = 1

module-margin = 1


font-0 = FiraCode Nerd Font:size=10;2

modules-left = xworkspaces cpu memory
modules-center =  date
modules-right = pulseaudio wlan

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true


[bar/second]
monitor = ${env:second}
width = 100%
height = 24pt
top = false
bottom = true
radius = 0

; dpi = 96

foreground = ${colors.foreground}

background = ${colors.background}
line-size = 3pt

border-size = 2
border-color = ${colors.primary}


padding-left = 1
padding-right = 1

module-margin = 1

font-0 = FiraCode Nerd Font:size=10;2
modules-left =  timer
modules-center =  
modules-right =   cava

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
