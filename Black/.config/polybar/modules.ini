[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.primary}
label-active-foreground = ${colors.background}
label-active-underline = ${colors.foreground}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.foreground}
label-urgent-underline = ${colors.primary}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1


[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.secondary}

label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}

format-muted-prefix = "󰖁 "
format-muted-prefix-foreground = ${colors.secondary}

label-muted = muted
label-muted-foreground = ${colors.foreground}

[network-base]
type = internal/network
interval = 5

format-connected = <label-connected>
format-disconnected = <label-disconnected>

label-disconnected = %ifname% disconnected
label-disconnected-foreground = ${colors.disabled}


[module/wlan]
inherit = network-base
interface-type = wireless

format-connected-prefix = "  "
format-connected-prefix-foreground = ${colors.secondary}

label-connected-foreground = ${colors.foreground}
label-connected =  %essid%


[module/date]
type = internal/date
interval = 1

format = <label>
format-prefix = "󰥔 "
format-prefix-foreground = ${colors.secondary}

date = %H:%M %Y/%m/%d

label = %date%
label-foreground = ${colors.foreground}

[module/cpu]
type = internal/cpu
interval = 0.5
warn-percentage = 95

format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.secondary}

label = CPU: %percentage%%
label-foreground = ${colors.foreground}

format-padding = 0
label-padding = 0
label-margin = 0


[module/memory]
type = internal/memory
interval = 3
warn-percentage = 95

format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.secondary}

label = RAM: %percentage_used%%
label-foreground = ${colors.foreground}


[module/cava]
type = custom/script
tail = true

exec = $HOME/.config/polybar/scripts/cava.sh

format = <label>
format-font = 5

label = %output%
label-foreground = ${colors.foreground}


[module/timer]
type = custom/script

exec = ~/.config/polybar/scripts/timer.sh tail '󰥔 Timer' 5
tail = true

format = <label>
label-foreground = ${colors.foreground}

click-left = ~/.config/polybar/scripts/timer.sh new 25 'Pomo session' 'Paused' 'notify-send "Session finished"' ; /path/to/polybar-timer.sh update %pid%
click-middle = ~/.config/polybar/scripts/timer.sh cancel ; /path/to/polybar-timer.sh update %pid%
click-right = ~/.config/polybar/scripts/timer.sh togglepause ; /path/to/polybar-timer.sh update %pid%
scroll-up = ~/.config/polybar/scripts/timer.sh increase 60 || /path/to/polybar-timer.sh new 1 'TIMER' 'PAUSED' 'notify-send -u critical "Timer expired."' ; /path/to/polybar-timer.sh update %pid%
scroll-down = ~/.config/polybar/scripts/timer.sh increase -60 ; /path/to/polybar-timer.sh update %pid%
