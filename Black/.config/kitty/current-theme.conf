## name: Black & White
## author: kimyosu
## blurb: Monochrome theme focused on pure black, white and neutral gray tones.

# Basic colors
foreground           #e8e8e8
background           #000000
selection_foreground #000000
selection_background #d9d9d9

# Cursor colors
cursor            #ffffff
cursor_text_color #000000

# URL underline color when hovering with mouse
url_color #bfbfbf

# Window border colors and terminal bell colors
active_border_color   #ffffff
inactive_border_color #333333
bell_border_color     #8b0000
visual_bell_color     none

# Tab bar colors
active_tab_foreground   #000000
active_tab_background   #ffffff
inactive_tab_foreground #bfbfbf
inactive_tab_background #181818
tab_bar_background      #000000
tab_bar_margin_color    none

# Mark colors (marked text in the terminal)
mark1_foreground #000000
mark1_background #ffffff

mark2_foreground #ffffff
mark2_background #8b0000

mark3_foreground #000000
mark3_background #999999

